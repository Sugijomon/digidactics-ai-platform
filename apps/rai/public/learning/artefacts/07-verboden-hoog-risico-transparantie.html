<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verboden, hoog risico en transparantie (RAI Learning Style)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7fafc;
  --surface:#ffffff;
  --text-primary:#181c1e;
  --text-secondary:#3e484f;
  --text-muted:#6993aa;
  --border-color:#bdc8d0;
  --radius-ui:8px;
  --radius-card:12px;
  --radius-pill:999px;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-brd:#F5C5BE;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-brd:#F5C875;
  --blue:#00658b;--blue-bg:#c4e7ff;--blue-brd:#a2d4f2;
}
html{overflow:hidden}
body{
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  padding:12px;
  max-width:none;
  margin:0 auto;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.header{text-align:center;margin-bottom:16px}
.header h1{
  font-family:'Manrope',sans-serif;
  font-size:18px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:4px;
  letter-spacing:0;
}
.header p{font-size:12px;color:var(--text-secondary)}
.main-container{
  display:grid;
  grid-template-columns:minmax(260px,.9fr) minmax(330px,1.25fr);
  gap:14px;
  width:100%;
  align-items:start;
}
.accordion-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.acc-item{
  background:var(--surface);
  border:1px solid var(--border-color);
  border-radius:var(--radius-ui);
  overflow:hidden;
  transition:border-color .15s;
}
.acc-item.active{border-color:var(--text-primary)}
.acc-trigger{
  width:100%;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:none;
  border:none;
  cursor:pointer;
  text-align:left;
}
.acc-title{
  font-family:'Manrope',sans-serif;
  font-size:12px;
  font-weight:700;
  color:var(--text-primary);
}
.acc-arrow{
  font-size:12px;
  color:var(--text-muted);
  transition:transform .2s ease;
}
.acc-item.active .acc-arrow{transform:rotate(90deg);color:var(--text-primary)}
.acc-content{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease-out;
  background:var(--bg);
}
.acc-item.active .acc-content{
  max-height:360px;
  border-top:1px solid var(--border-color);
}
.sub-list{padding:6px;display:flex;flex-direction:column;gap:4px}
.sub-btn{
  width:100%;
  padding:8px;
  background:var(--surface);
  border:1px solid var(--border-color);
  border-radius:6px;
  text-align:left;
  cursor:pointer;
  display:flex;
  gap:8px;
  align-items:flex-start;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.sub-btn:hover{background:var(--bg)}
.sub-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sub-btn.selected{
  border-color:var(--text-primary);
  background:var(--surface);
  box-shadow:inset 2px 0 0 var(--text-primary);
}
.sub-icon{font-size:14px;margin-top:1px}
.sub-text-title{font-size:11px;font-weight:600;color:var(--text-primary);line-height:1.3}
.sub-text-note{font-size:10px;color:var(--text-muted);line-height:1.2;margin-top:1px}
.detail-side{min-width:0}
.detail-card{
  background:var(--surface);
  border:1px solid var(--border-color);
  border-radius:var(--radius-card);
  padding:14px;
  min-height:340px;
  display:flex;
  flex-direction:column;
}
.detail-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:auto;
  text-align:center;
  color:var(--text-muted);
  gap:8px;
}
.detail-empty svg{opacity:.4}
.detail-main-content{animation:fadeIn .2s ease-out}
.detail-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.detail-title{
  font-family:'Manrope',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--text-primary);
}
.detail-desc{font-size:11.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px}
.section-title{
  font-family:'Manrope',sans-serif;
  font-size:10px;
  font-weight:600;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin:12px 0 6px;
}
.obligations-list{display:flex;flex-direction:column;gap:5px}
.obligation-item{
  display:flex;
  align-items:flex-start;
  gap:6px;
  font-size:11px;
  color:var(--text-secondary);
  line-height:1.35;
}
.obligation-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.signal-box{
  padding:10px;
  border-radius:var(--radius-ui);
  border:1px solid transparent;
  font-size:11px;
  line-height:1.4;
  margin-top:12px;
}
.signal-box strong{display:block;font-family:'Manrope',sans-serif;margin-bottom:2px}
.sig-red{background:var(--red-bg);border-color:var(--red-brd);color:var(--red)}
.sig-amber{background:var(--amber-bg);border-color:var(--amber-brd);color:#633806}
.sig-blue{background:var(--blue-bg);border-color:var(--blue-brd);color:#004d6a}
.meta-row{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-top:14px;
  border-top:1px solid var(--border-color);
  padding-top:10px;
}
.meta-tag{
  font-size:9.5px;
  font-family:system-mono,monospace;
  background:var(--bg);
  border:1px solid var(--border-color);
  padding:2px 6px;
  border-radius:4px;
  color:var(--text-secondary);
}
@keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:580px){
  .main-container{display:flex;flex-direction:column}
  .accordion-side,.detail-side{width:100%}
}
</style>
</head>

let currentAccordion = null;
let selectedCount = 0;
const selectedKeys = new Set();

function notifyResize() {
  requestAnimationFrame(() => {
    const bodyRect = document.body.getBoundingClientRect();
    const docRect = document.documentElement.getBoundingClientRect();
    const height = Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight,
      bodyRect.bottom - bodyRect.top,
      docRect.bottom - docRect.top
    );
    window.parent?.postMessage({
      type: "digidactics_resize",
      blockId: "p5-rich-html-verboden-hoog-risico-transparantie",
      height: Math.ceil(height) + 2
    }, "*");
  });
}

function toggleAccordion(id) {
  const item = document.getElementById(`item-${id}`);
  const isActive = item.classList.contains("active");

  document.querySelectorAll(".acc-item").forEach((el) => {
    el.classList.remove("active");
    el.querySelector(".acc-trigger")?.setAttribute("aria-expanded", "false");
  });

  currentAccordion = isActive ? null : id;
  if (!isActive) {
    item.classList.add("active");
    item.querySelector(".acc-trigger")?.setAttribute("aria-expanded", "true");
  }

  notifyResize();
}

function selectSubitem(key) {
  document.querySelectorAll(".sub-btn").forEach((btn) => btn.classList.remove("selected"));
  document.getElementById(`btn-${key}`).classList.add("selected");

  selectedKeys.add(key);
  selectedCount += 1;

  const d = DATA[key];
  document.getElementById("detail-empty").style.display = "none";
  const content = document.getElementById("detail-content");
  content.style.display = "block";

  document.getElementById("d-icon").textContent = d.icon;
  document.getElementById("d-title").textContent = d.title;
  document.getElementById("d-desc").textContent = d.desc;
  document.getElementById("d-obligations-label").textContent = d.label;

  const color = d.stype === "red" ? "var(--red)" : d.stype === "amber" ? "var(--amber)" : "var(--blue)";
  document.getElementById("d-obligations-list").innerHTML = d.obligations.map((o) => `
    <div class="obligation-item">
      <div class="obligation-dot" style="background:${color}"></div>
      <span>${o}</span>
    </div>
  `).join("");

  const signalBox = document.getElementById("d-signal");
  signalBox.className = `signal-box sig-${d.stype}`;
  signalBox.innerHTML = `<strong>Praktische signalen voor MKB:</strong> ${d.signal}`;
  document.getElementById("d-meta-art").textContent = d.art;
  document.getElementById("d-meta-date").textContent = d.date;

  notifyResize();

  if (selectedKeys.size >= 3) {
    window.parent?.postMessage({
      type: "digidactics_event",
      event: "block_complete",
      blockId: "p5-rich-html-verboden-hoog-risico-transparantie",
      answer: "drie-voorbeelden-bekeken"
    }, "*");
  }
}

window.addEventListener("load", notifyResize);
document.fonts?.ready?.then(notifyResize);
</script>
</body>
</html>
